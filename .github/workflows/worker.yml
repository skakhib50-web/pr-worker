name: worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Run worker (all output discarded - the repo is public)
        run: python worker.py > /dev/null 2>&1
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          IDLE_EXIT_SECONDS: '240'
          HEADLESS: '1'
          SAVE_SHOTS: '0'
